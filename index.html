<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Метатеги за замовчуванням. У збірці scripts/gen-pages.mjs замінює
      <title> і всі теги з data-rh="true" тегами конкретної сторінки й пише
      dist/<шлях>.html — їх бачать скребачки соцмереж і роботи без JS. Тут
      вони лишаються для dev-сервера й адрес, яких немає в getPageMetaMap.
      Після запуску React сторінкові теги ставить PageMeta (react-helmet-async).

      data-rh="true" — лише на тегах, які PageMeta перевизначає: Helmet
      прибирає зі <head> тільки їх. Без атрибута сторінкові теги лягли б поруч
      із загальними (два description, два og:title). Теги, яких PageMeta не
      рендерить (theme-color, og:site_name, og:locale, twitter:card), не
      позначати — інакше Helmet їх видалить.

      Тексти title і description — ті самі, що в головної в
      src/constants/pagesMeta.ts.
    -->
    <title>Назва сайту</title>
    <meta data-rh="true" name="description" content="Опис сайту, 150–160 символів." />
    <meta name="theme-color" content="#0a0a0a" />

    <meta data-rh="true" property="og:type" content="website" />
    <meta property="og:site_name" content="Назва сайту" />
    <meta property="og:locale" content="uk_UA" />
    <meta data-rh="true" property="og:title" content="Назва сайту" />
    <meta data-rh="true" property="og:description" content="Опис сайту, 150–160 символів." />
    <meta data-rh="true" property="og:image" content="https://example.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Прелоадер живе поза React: показується одразу, ще до завантаження JS.
      Контракт із застосунком:
      - window.updateLoader(100) викликає PageLoaderSignal, щойно перша
        сторінка відрендерилась;
      - поки прелоадер на екрані, на body висить клас loading;
      - коли він зник — у window летить подія loaderFinished, на неї чекають
        стартові анімації (useLoaderFinished, useReveal).
      Вигляд прелоадера — під дизайн проєкту, контракт лишати.
    -->
    <style>
      body.loading {
        overflow: hidden;
      }

      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      .preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .preloader__spinner {
        width: 48px;
        height: 48px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: preloader-spin 0.9s linear infinite;
      }

      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="loading">
    <div class="preloader" id="preloader" role="status" aria-label="Завантаження">
      <div class="preloader__spinner"></div>
    </div>

    <div id="root"></div>
    <!-- Сюди порталом рендеряться модалки (ModalWin, useModalWin) -->
    <div id="modal-root"></div>

    <script>
      (function () {
        var preloader = document.getElementById('preloader');
        var isDone = false;

        window.updateLoader = function (percent) {
          if (isDone || percent < 100) return;
          isDone = true;

          preloader.classList.add('is-hidden');
          document.body.classList.remove('loading');
          window.dispatchEvent(new Event('loaderFinished'));
        };

        // Страховка: якщо React з якоїсь причини не повідомив про готовність,
        // прелоадер не має висіти вічно.
        window.addEventListener('load', function () {
          setTimeout(function () {
            window.updateLoader(100);
          }, 5000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
