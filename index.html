<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Збірка (scripts/gen-pages.mjs) замінює <title> і теги з data-rh="true"
      тегами кожної сторінки; ці — для dev і адрес поза getPageMetaMap.
      data-rh="true" — лише на тегах, які перевизначає PageMeta: Helmet
      прибирає тільки їх, інакше теги задвоїлись би, а без атрибута — видалить
      і ті, яких PageMeta не рендерить.
    -->
    <title>Назва сайту</title>
    <meta data-rh="true" name="description" content="Опис сайту, 150–160 символів." />
    <meta name="theme-color" content="#0a0a0a" />

    <meta data-rh="true" property="og:type" content="website" />
    <meta property="og:site_name" content="Назва сайту" />
    <meta property="og:locale" content="uk_UA" />
    <meta data-rh="true" property="og:title" content="Назва сайту" />
    <meta data-rh="true" property="og:description" content="Опис сайту, 150–160 символів." />
    <meta data-rh="true" property="og:image" content="https://example.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Фон = theme.colors.background, інакше до завантаження JS перший кадр
      білий. Знімок пререндера — для роботів; людям він без стилів, тож
      прихований, доки createRoot не замінить його сторінкою.
    -->
    <style>
      html {
        background-color: #0a0a0a;
      }

      [data-prerender] {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
